<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SubTrack — интерактивный макет</title>
<style>
:root{--green:#176b5b;--ink:#172d28;--muted:#66756f;--bg:#f5f7f4;--soft:#e5eee8;--line:#dbe3dd;--red:#a43d3d}*{box-sizing:border-box}body{margin:0;background:#e8ede8;color:var(--ink);font:15px/1.45 Arial,sans-serif}.workspace{display:flex;gap:56px;align-items:flex-start;justify-content:center;padding:40px 24px}.guide{width:280px;padding-top:30px}.guide h1{font-size:40px;letter-spacing:-2px;margin:8px 0}.guide p{color:var(--muted)}.guide button{margin:8px 0}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--green)}.phone{width:390px;min-height:844px;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 20px 70px #253a2920;position:relative}.status{height:32px;padding:8px 22px;font-size:11px;display:flex;justify-content:space-between}header{height:68px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line)}header h2{font-size:22px;letter-spacing:-.6px;margin:0;flex:1}header button{padding:8px;background:transparent;color:var(--ink);font-size:20px;border:0;width:38px;min-height:44px}main{padding:22px;min-height:650px;padding-bottom:90px}h3{margin:0 0 12px;font-size:26px;line-height:1.15;letter-spacing:-.7px}p{margin:0 0 16px}.small{font-size:12px;color:var(--muted)}.hero{background:var(--green);color:white;border-radius:24px;padding:24px;margin-bottom:24px}.hero .total{font-size:36px;font-weight:bold;letter-spacing:-1px;margin:7px 0}.hero p{margin:0;opacity:.8;font-size:13px}.section{display:flex;justify-content:space-between;margin:20px 0 12px;font-weight:bold}.section span{font-size:12px;color:var(--muted);font-weight:normal}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;cursor:pointer}.cardtop{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:14px;color:white;display:grid;place-items:center;font-size:20px;font-weight:bold;flex-shrink:0}.cardname{flex:1;font-weight:bold}.cardname small{display:block;font-weight:normal;color:var(--muted);font-size:12px;margin-top:2px}.price{text-align:right;font-weight:bold;font-size:14px}.price small{display:block;font-size:11px;color:var(--muted);font-weight:normal}.tag{margin-top:12px;background:#edf2ee;color:#425a4e;font-size:11px;padding:7px 9px;border-radius:8px;display:flex;justify-content:space-between}.soon{background:#fff0dc;color:#895719}.trial{color:#7452aa}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:12px 16px;min-height:46px;background:var(--green);color:white;font-weight:bold}button.secondary{background:var(--soft);color:var(--green)}button.link{background:transparent;color:var(--green)}button.danger{background:#f6e5e2;color:var(--red)}button.full{width:100%;margin:8px 0}input,select{font:inherit;color:var(--ink);width:100%;background:white;border:1px solid #cdd8cf;padding:13px;border-radius:12px;min-height:48px}input:focus,select:focus{outline:2px solid #85b7a5}label{display:block;font-size:12px;font-weight:bold;margin:0 0 7px}.field{margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 100px;gap:12px}.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:18px 0}.check input{width:20px;min-height:20px}.error{background:#ffe9e5;color:#9a3d31;border-radius:10px;padding:10px;font-size:13px;margin:12px 0;display:none}nav{position:absolute;bottom:0;left:0;right:0;display:flex;height:76px;border-top:1px solid var(--line);background:var(--bg);padding:8px 16px}nav button{background:transparent;color:var(--muted);font-size:11px;font-weight:normal;flex:1;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px}nav b{font-size:19px;line-height:23px;border-radius:15px;width:52px}nav .active{color:var(--green);font-weight:bold}nav .active b{background:#d8e9df}.fab{position:absolute;right:22px;bottom:94px;font-size:27px;width:54px;height:54px;padding:0;border-radius:18px;box-shadow:0 4px 12px #0002}.seg{display:flex;padding:4px;background:var(--soft);border-radius:14px}.seg button{padding:9px 0;min-height:40px;flex:1;color:var(--muted);background:transparent;font-size:12px}.seg .active{background:white;color:var(--green);box-shadow:0 2px 6px #0001}.ring{width:218px;height:218px;margin:28px auto;border-radius:50%;position:relative;background:conic-gradient(#176b5b 0% 23.93%,#7d68c4 23.93% 63.87%,#e5a341 63.87% 79.8%,#4c8cba 79.8% 100%);display:grid;place-items:center}.ring:before{content:'';position:absolute;inset:23px;border-radius:50%;background:var(--bg)}.ring div{position:relative;text-align:center}.ring strong{display:block;font-size:28px;letter-spacing:-1px}.legend{display:flex;align-items:center;gap:12px;margin:14px 0;cursor:pointer}.dot{width:12px;height:12px;border-radius:4px}.legend span{flex:1}.row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);gap:10px}.row b{font-weight:normal;text-align:right}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.brand{font-size:44px;color:var(--green);font-weight:bold;letter-spacing:-2px;margin:12px 0 22px}.auth h3{font-size:30px;max-width:260px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#243c32;color:white;padding:14px 22px;border-radius:12px;z-index:10;display:none;max-width:90vw}.profile{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:24px}.profile h3{font-size:23px;margin:10px 0 4px}body.dark{--bg:#19241f;--ink:#edf4ec;--muted:#b0c0b5;--soft:#34483c;--line:#3c4b40;background:#101a14}.dark .card,.dark input,.dark select,.dark .profile{background:#25362a}.dark .seg .active{background:#455c4b;color:white}@media(max-width:760px){.workspace{padding:0}.guide{display:none}.phone{width:100%;min-height:100dvh;border:0;border-radius:0;box-shadow:none}main{min-height:calc(100dvh - 100px)}}

.phone{height:844px;display:flex;flex-direction:column}.status,header{flex-shrink:0}main{flex:1;min-height:0;overflow-y:auto}nav{position:static;flex-shrink:0}.auth .brand{font-size:38px;margin:0 0 14px}.auth h3{font-size:27px;max-width:none}.auth .field{margin-bottom:14px}@media(max-width:760px){.phone{height:100dvh}main{min-height:0}}
</style></head><body><div class="workspace"><aside class="guide"><div class="eyebrow">ПРАКТИЧЕСКАЯ РАБОТА 2</div><h1>SubTrack</h1><p>Интерактивный макет мобильного приложения.</p><button onclick="demo()">Открыть демосценарий</button><button class="secondary" onclick="go('login')">Вход и регистрация</button></aside><div class="phone" id="phone"><div class="status"><span>9:41</span><span>● ▰ ▮</span></div><header id="header"></header><main id="main"></main><nav id="nav"></nav><button class="fab" id="fab" aria-label="Добавить подписку" onclick="go('form')">+</button></div></div><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categories=['Музыка','Видео','Облако','Обучение','Прочее'],colors=['#176b5b','#7d68c4','#e5a341','#4c8cba','#9b6878'];
const periods={MONTH:'Месяц',QUARTER:'Квартал',YEAR:'Год',WEEK:'Неделя'};
let store=JSON.parse(localStorage.getItem('subtrack-demo-v2')||'{"users":[],"items":[]}'),user=null,screen='login',selected=null,period=1,query='';
const money=n=>n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const save=()=>localStorage.setItem('subtrack-demo-v2',JSON.stringify(store));
const own=()=>store.items.filter(s=>s.owner==user?.email), active=()=>own().filter(s=>!s.archived);
const isRub=s=>s.currency==='RUB';
const month=s=>isRub(s)?(s.amount/100)*(s.period==='YEAR'?1/12:s.period==='QUARTER'?1/3:s.period==='WEEK'?52/12:1):0;
const legacyNotice=()=>active().some(s=>!isRub(s))?'<p class="small">Для части старых записей нужно указать стоимость в рублях. Откройте запись и нажмите «Редактировать».</p>':'';
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4200)}
function go(s,id=null){screen=s;selected=id;render()}
function error(t){$('#error').textContent=t;$('#error').style.display='block'}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function choice(label,name,values,value){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${Object.entries(values).map(([v,t])=>`<option value="${v}" ${v==value?'selected':''}>${t}</option>`).join('')}</select></div>`}
function card(s){const days=Math.round((new Date(s.date+'T12:00:00')-new Date('2026-10-27T12:00:00'))/86400000);return `<article class="card" tabindex="0" role="button" aria-label="${esc(s.name)}" onclick="go('detail',${s.id})" onkeydown="if(event.key==='Enter')go('detail',${s.id})"><div class="cardtop"><div class="avatar" style="background:${colors[categories.indexOf(s.category)]}">${esc(s.name[0])}</div><div class="cardname">${esc(s.name)}<small>${s.category}</small></div><div class="price">${isRub(s)?money(s.amount/100)+' ₽':'Укажите стоимость в ₽'}<small>${periods[s.period].toLowerCase()}</small></div></div><div class="tag ${days<=3?'soon':''}"><span>${s.archived?'В архиве':days<0?'Дата списания прошла':days===0?'Списание сегодня':`Через ${days} дн. · ${s.date.slice(8)}.${s.date.slice(5,7)}`}</span>${s.trial?'<span class="trial">Пробный период</span>':''}</div></article>`}
function demo(){user={name:'Тимофей',email:'demo@subtrack.test'};if(!store.items.some(s=>s.owner===user.email)){store.items.push(...[
 ['Музыка Плюс',29900,'MONTH','2026-10-29','Музыка',false,false],['Кино Онлайн',49900,'MONTH','2026-11-03','Видео',true,false],['Облако 200 ГБ',19900,'MONTH','2026-11-12','Облако',false,false],['Курс Языка',302400,'YEAR','2026-12-01','Обучение',false,false],['Старый сервис',39900,'MONTH','2026-10-15','Видео',false,true]
].map((a,i)=>({id:Date.now()+i,owner:user.email,name:a[0],amount:a[1],period:a[2],date:a[3],category:a[4],trial:a[5],archived:a[6],currency:'RUB'})));save()}go('home')}
async function hash(pass,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:600000,hash:'SHA-256'},key,256);return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function auth(event,register){event.preventDefault();const f=new FormData(event.target),email=f.get('email').trim().toLowerCase(),pass=f.get('password');if(register){if(pass.length<10||pass.length>128)return error('Пароль должен содержать от 10 до 128 символов');if(pass!==f.get('confirm'))return error('Пароли не совпадают');if(store.users.some(u=>u.email===email))return error('Этот адрес уже зарегистрирован');const salt=crypto.randomUUID();user={email,name:f.get('name').trim(),salt,hash:await hash(pass,salt)};store.users.push(user);save()}else{const found=store.users.find(u=>u.email===email);if(!found||await hash(pass,found.salt)!==found.hash)return error('Неверный адрес или пароль');user=found}go('home')}
function saveForm(event){event.preventDefault();const f=new FormData(event.target),text=f.get('amount').replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(text)||+text<=0||+text>100000000)return error('Введите положительную сумму с точностью до копеек');const s={id:selected||Date.now(),owner:user.email,name:f.get('name').trim(),amount:Math.round(+text*100),currency:'RUB',period:f.get('period'),date:f.get('date'),category:f.get('category'),trial:f.has('trial'),archived:false};if(!s.name)return error('Введите название');const old=own().find(x=>x.id===selected);if(old){s.archived=old.archived;Object.assign(old,s)}else store.items.push(s);save();go('home');toast('Подписка сохранена')}
function render(){const main=['home','stats','archive'].includes(screen),s=own().find(x=>x.id===selected),titles={login:'Вход',register:'Регистрация',home:'SubTrack',stats:'Статистика',archive:'Архив',form:selected?'Редактирование':'Новая подписка',detail:'Подписка',settings:'Настройки'};
 $('#header').innerHTML=`${!main&&screen!=='login'?`<button aria-label="Назад" onclick="go('${screen==='register'?'login':'home'}')">‹</button>`:''}<h2>${titles[screen]}</h2>${main?'<button aria-label="Настройки" onclick="go(\'settings\')">⚙</button>':''}`;
 $('#nav').style.display=main?'flex':'none';$('#fab').style.display=screen==='home'?'block':'none';$('#nav').innerHTML=[['home','⌂','Подписки'],['stats','◔','Статистика'],['archive','▤','Архив']].map(([r,i,t])=>`<button class="${screen===r?'active':''}" onclick="go('${r}')"><b>${i}</b>${t}</button>`).join('');let html='';
 if(screen==='login'||screen==='register'){const reg=screen==='register';html=`<div class="auth"><div class="brand">SubTrack<span style="color:#a2bbae">.</span></div><h3>${reg?'Создайте локальный профиль':'Все подписки под контролем'}</h3><p class="small">${reg?'Профиль хранится на этом устройстве. Почта используется как логин.':'Следите за расходами и датами списаний в одном месте.'}</p><form onsubmit="auth(event,${reg})">${reg?field('Как вас зовут','name','','text','required minlength="2" maxlength="60"'):''}${field('Электронная почта','email','','email','required autocomplete="username"')}${field('Пароль','password','','password','required maxlength="128" autocomplete="current-password"')}${reg?field('Повторите пароль','confirm','','password','required'):''}${reg?'<p class="small">Пароль: от 10 до 128 символов</p>':''}<div class="error" id="error" role="alert"></div><button class="full">${reg?'Создать профиль':'Войти'}</button></form><button class="link full" onclick="go('${reg?'login':'register'}')">${reg?'Уже есть профиль':'Создать профиль'}</button>${!reg?'<button class="secondary full" onclick="demo()">Посмотреть демоданные</button>':''}</div>`}
 if(screen==='home'){html=`<p class="small">Здравствуйте, ${esc(user?.name)}</p><div class="hero"><p>В СРЕДНЕМ ЗА МЕСЯЦ</p><div class="total">${money(active().reduce((a,s)=>a+month(s),0))} ₽</div><p>${active().length} активные подписки</p></div>${legacyNotice()}<input id="search" aria-label="Найти подписку" placeholder="Найти подписку" value="${esc(query)}" oninput="query=this.value;filterCards()"><div class="section">Ближайшие списания<span>По дате</span></div><div id="cards">${active().filter(s=>s.name.toLowerCase().includes(query.toLowerCase())).map(card).join('')||'<p class="empty">Добавьте первую подписку кнопкой +</p>'}</div>`}
 if(screen==='form'){html=`<form onsubmit="saveForm(event)">${field('Название сервиса','name',s?.name||'','text','required maxlength="60"')}${field('Стоимость, ₽','amount',s&&isRub(s)?String(s.amount/100):'','text','required inputmode="decimal"')}${s&&!isRub(s)?'<p class="small">Введите стоимость этой записи в рублях. До сохранения она не учитывается в итогах.</p>':''}${choice('Период оплаты','period',periods,s?.period||'MONTH')}${field('Следующее списание','date',s?.date||'2026-10-28','date','required')}${choice('Категория','category',Object.fromEntries(categories.map(c=>[c,c])),s?.category||'Прочее')}<label class="check"><input type="checkbox" name="trial" ${s?.trial?'checked':''}>Пробный период</label><div class="error" id="error" role="alert"></div><button class="full">Сохранить подписку</button><p class="small">Списание не выполняется автоматически. Это запись для учёта расходов.</p></form>`}
 if(screen==='detail'&&s){html=`<div class="avatar" style="background:${colors[categories.indexOf(s.category)]};width:64px;height:64px;font-size:30px;margin:5px 0 18px">${esc(s.name[0])}</div><h3>${esc(s.name)}</h3><p class="small">${s.category} · ${s.archived?'Архив':'Активная подписка'}</p><div class="hero"><p>СТОИМОСТЬ ПОДПИСКИ</p><div class="total">${isRub(s)?money(s.amount/100)+' ₽':'Укажите стоимость в ₽'}</div><p>Каждый ${periods[s.period].toLowerCase()}</p></div><div class="row"><span>Следующее списание</span><b>${s.date.split('-').reverse().join('.')}</b></div><div class="row"><span>Оценка за год</span><b>${isRub(s)?money(month(s)*12)+' ₽':'—'}</b></div><div class="row"><span>Пробный период</span><b>${s.trial?'Да':'Нет'}</b></div><button class="full" onclick="go('form',${s.id})">Редактировать</button><button class="secondary full" onclick="archiveItem(${s.id})">${s.archived?'Восстановить':'Переместить в архив'}</button><button class="link full" style="color:var(--red)" onclick="deleteItem(${s.id})">Удалить подписку</button>`}
 if(screen==='stats'){const sums=categories.map(c=>[c,active().filter(s=>s.category===c).reduce((a,s)=>a+month(s)*period,0)]),total=sums.reduce((a,s)=>a+s[1],0);let start=0;const stops=sums.filter(x=>x[1]>0).map(([c,v])=>{const end=start+v/total*100,result=`${colors[categories.indexOf(c)]} ${start}% ${end}%`;start=end;return result});html=`<div class="seg">${[[1,'Месяц'],[3,'Квартал'],[12,'Год']].map(([n,t])=>`<button class="${period===n?'active':''}" onclick="period=${n};render()">${t}</button>`).join('')}</div><div class="ring" style="background:${total?'conic-gradient('+stops.join(',')+')':'#dce5df'}"><div><span class="small">Всего за период</span><strong>${money(total)} ₽</strong></div></div><p class="small" style="text-align:center">Оценка регулярных расходов</p>${legacyNotice()}<div class="section">По категориям</div>${sums.map(([c,v])=>`<div class="legend" onclick="toast('${c}: ${money(v)} ₽')"><i class="dot" style="background:${colors[categories.indexOf(c)]}"></i><span>${c}</span><b>${money(v)} ₽</b></div>`).join('')}<p class="small" style="margin-top:24px">Архив не включён. Это средняя нагрузка, а не сумма фактических списаний за календарный период.</p>`}
 if(screen==='archive')html=`<h3>Подписки на паузе</h3><p class="small">Сохранены в истории и исключены из текущих расходов. Восстановить можно в карточке.</p>${own().filter(s=>s.archived).map(card).join('')||'<p class="empty">Архив пока пуст</p>'}`;
 if(screen==='settings')html=`<div class="profile"><div class="avatar" style="background:var(--green)">${esc(user?.name?.[0]||'П')}</div><h3>${esc(user?.name)}</h3><p class="small">${esc(user?.email)}</p><span class="small">Локальный профиль</span></div><div class="row"><span>Валюта</span><b>Российский рубль · ₽</b></div><div class="row"><span>Тёмная тема</span><input aria-label="Тёмная тема" type="checkbox" style="width:20px;min-height:20px" ${document.body.classList.contains('dark')?'checked':''} onchange="document.body.classList.toggle('dark',this.checked)"></div><button class="link full" onclick="user=null;go('login')">Выйти из профиля</button>`;
 $('#main').innerHTML=html;$('#main').scrollTop=0;
}
function filterCards(){$('#cards').innerHTML=active().filter(s=>s.name.toLowerCase().includes(query.toLowerCase())).map(card).join('')||'<p class="empty">Ничего не найдено</p>'}
function archiveItem(id){const s=own().find(s=>s.id===id);s.archived=!s.archived;save();render();toast(s.archived?'Перемещено в архив':'Подписка восстановлена')}
function deleteItem(id){if(confirm('Удалить подписку без возможности восстановления?')){store.items=store.items.filter(s=>!(s.id===id&&s.owner===user.email));save();go('home')}}
render();
</script></body></html>
